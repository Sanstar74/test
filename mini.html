<meta name="theme-color" content="#05030f">
<meta name="color-scheme" content="dark">
<title>Vibely</title>
<noscript><style>#fallback{display:flex!important}.ui,#status{display:none!important}</style></noscript>

#scene{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.4s ease}
.ready #scene{opacity:1}
.ui{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;padding:max(1.5rem,env(safe-area-inset-top)) 1.5rem max(1.5rem,env(safe-area-inset-bottom)) clamp(1.5rem,9vw,8rem);opacity:1;visibility:visible;transition:opacity .9s ease,visibility 0s}
.ui::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(to right,rgba(7,11,24,.7),rgba(7,11,24,0) 60%)}
body:not([data-state="intro"]) #uiIntro,body:not([data-state="arrived"]) #uiArrive,body:not([data-state="travel"]) #status{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .8s ease,visibility 0s .8s}

h1{font-size:clamp(3.2rem,11vw,6.5rem);color:#f2f7ff}
h2{font-size:clamp(1.8rem,5vw,3rem);margin:.7rem 0 1.4rem}
.tag{margin:.8rem 0 2rem;font-size:clamp(1rem,2.4vw,1.2rem);color:#cfdcf2;max-width:22rem}
.place{display:inline-flex;align-items:center;gap:.6rem;margin:0;padding:.35rem 1rem;border:1px solid rgba(220,236,255,.5);border-radius:99px;background:rgba(7,11,24,.4);color:#dcecff;font-weight:500}
.place::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:#d6ebff}
.btn{display:inline-block;font:600 1.05rem system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#0b1730;text-decoration:none;cursor:pointer;border:0;padding:.85rem 2.2rem;border-radius:99px;background:#d6ebff;transition:background .2s,transform .2s}
.btn:hover{background:#fff;transform:translateY(-2px)}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.btn:focus-visible{outline:3px solid #fff;outline-offset:4px}
#status{position:fixed;z-index:2;left:0;right:0;bottom:max(2.5rem,calc(env(safe-area-inset-bottom) + 1.5rem));display:flex;flex-direction:column;align-items:center;gap:.8rem;font-size:1.1rem;font-weight:500;color:#f2f7ff;transition:opacity .8s ease,visibility 0s}
.track{display:block;width:min(16rem,60vw);height:3px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
#bar{display:block;height:100%;width:100%;background:#d6ebff;transform-origin:left;transform:scaleX(0)}
#fallback{display:none;position:fixed;inset:0;z-index:3;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.5rem}
#fallback p{max-width:30rem;color:#cfdcf2;margin:1rem 0 2rem}
#arrivalBrand{font-size:clamp(4rem,18vw,10rem);letter-spacing:-.06em;min-height:1.05em}
#go{opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease,visibility 0s .4s}
#go.visible{opacity:1;visibility:visible;transform:translateY(0);transition-delay:0s}
.nogl #fallback{display:flex}.nogl .ui,.nogl #status{display:none}
@media (max-width:700px){.ui{align-items:center;justify-content:flex-end;text-align:center;padding:1.5rem 1.5rem max(3rem,calc(env(safe-area-inset-bottom) + 1.5rem))}.ui::before{background:linear-gradient(to top,rgba(7,11,24,.8),rgba(7,11,24,0) 65%)}.tag{margin-left:auto;margin-right:auto}}
@media (prefers-reduced-motion:reduce){#scene,.ui,#status,.btn{transition-duration:.01s!important}}
</style>
</head>
<body data-state="intro">
<canvas id="scene" aria-hidden="true"></canvas>

<div class="ui" id="uiIntro">
  <h1>Vibely</h1>
  <p class="tag">Chat. Share moments. Find your vibe.</p>
  <button class="btn" id="start" type="button" disabled>Start Vibely</button>
</div>

<div id="status" role="status" aria-live="polite"><span id="statusText"></span><span class="track"><b id="bar"></b></span></div>

<div class="ui" id="uiArrive">
  <p class="place">India · Earth</p>
  <h1 id="arrivalBrand" aria-label="Vibely"></h1>
  <a class="btn" id="go" href="vibely-about-us.html">Go to home page</a>
</div>

<div id="fallback">
  <h1>Vibely</h1>
  <p>The 3D intro isn’t available on this device or connection. You can still continue to Vibely.</p>
  <a class="btn" href="vibely-about-us.html">Go to home page</a>
</div>
